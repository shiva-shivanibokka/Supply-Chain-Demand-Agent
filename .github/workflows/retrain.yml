name: Retrain TFT

# Triggered from the MLOps Monitor "Trigger retraining" button (via /api/retrain)
# or manually from the Actions tab. Retrains the TFT on GitHub's free CPU runners
# across ALL parts, exports fresh forecasts, and commits them straight to main —
# Vercel then auto-deploys the refreshed model. Fully automated: no PR to merge.
#
# Trade-off (see the note in the MLOps tab): CPU runners are slow, so epochs are
# capped — the auto-retrained model keeps full 200-part coverage but is less
# trained than a local GPU run. For best quality, retrain on a GPU locally.
on:
  workflow_dispatch:
    inputs:
      max_epochs:
        description: "Max training epochs (kept low for CPU time)"
        default: "3"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      RETRAIN_MAX_EPOCHS: ${{ github.event.inputs.max_epochs || '3' }}
      RETRAIN_NUM_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch + ML stack
        # torch==2.5.1 here must stay in sync with requirements-local.txt, or pip
        # will resolve a mismatched torch and pull the large CUDA wheel instead
        # of this CPU-only one.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local.txt

      - name: Ensure dataset
        run: python -m data.generate_data

      - name: Train TFT (CPU, all parts)
        run: python -m forecasting.train

      - name: Export forecasts
        run: python -m forecasting.export_forecasts

      - name: Commit refreshed forecasts to main (auto-deploys)
        run: |
          if git diff --quiet -- lib/data/forecasts.json; then
            echo "forecasts.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/forecasts.json
          git commit -m "Retrain: update TFT forecasts (automated CPU retrain)"
          git push origin HEAD:main
