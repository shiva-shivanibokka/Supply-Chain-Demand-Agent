name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # No Python ran in CI at all, so the regression tests written for the export
  # bug -- the one that made the committed "forecasts" predictions of the last
  # 30 already-observed days -- were never enforced. They are scripts, not
  # pytest cases: each exits 0 on pass, which is why `pytest eval_sop` collects
  # nothing and why they were easy to miss.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This repo's deps live in requirements-local.txt, which the default
          # glob (**/requirements.txt, **/pyproject.toml) does not match, so
          # `cache: pip` alone fails the step outright with "No file ...
          # matched" before anything installs.
          cache-dependency-path: requirements-local.txt
      # Deliberately NOT `-r requirements-local.txt`. That file is the full
      # local stack, and installing it here fails: sentence-transformers brings
      # a `transformers` that pytorch-forecasting's torchmetrics then cannot
      # import ("Could not import module 'AutoModel'"), so the job died before
      # running a test. These four are the only packages the four tests touch,
      # pinned to the same versions requirements-local.txt pins, and verified
      # in a clean virtualenv: all four exit 0.
      - name: Install the deps these tests actually need (CPU torch)
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install pytorch-forecasting==1.7.0 pandas==2.2.2 numpy==1.26.4 \
                      chromadb==1.5.5
      - name: Export-bug and agent regression tests
        run: |
          set -e
          python -m eval_sop.test_best_checkpoint
          python -m eval_sop.test_agent_grader
          python -m eval_sop.test_export_forecasts
          python -m eval_sop.test_agent_forecast_path
